<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunNotes · 工作台</title>
<link rel="stylesheet" href="./shared/style.css">
<style>
  /* 工作台专属：笔记本网格 */
  .workspace-app { flex-direction: column; }

  .workbench {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .wb-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .wb-title { margin: 0; font-size: 24px; font-weight: 600; }
  .wb-sub { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  .nb-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .nb-card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .nb-card:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
    transform: translateY(-1px);
  }

  .nb-card-main {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    width: 100%;
    min-height: 118px;
    padding: 18px 16px;
    background: none;
    border: none;
    border-radius: 12px;
    text-align: left;
  }

  .nb-icon { font-size: 26px; line-height: 1; }
  .nb-name {
    font-size: 15px;
    font-weight: 600;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nb-meta { font-size: 12px; color: var(--muted); }

  .nb-more {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    border: 1px solid transparent;
    background: none;
    color: var(--muted);
    opacity: 0;
    transition: opacity .15s, background .15s, color .15s, border-color .15s;
  }
  .nb-card:hover .nb-more { opacity: 1; }
  .nb-more:hover { background: var(--bg); color: var(--text); border-color: var(--border); }

  .nb-card.new { border-style: dashed; }
  .nb-card.new .nb-card-main {
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  .nb-card.new:hover .nb-card-main { color: var(--accent); }
  .nb-card.new .nb-plus { font-size: 22px; }

  /* 底栏的下拉菜单靠右收窄，避免横跨整页 */
  .footer-bar .footer-dropdown {
    left: auto;
    right: 20px;
    min-width: 220px;
  }

  @media (max-width: 720px) {
    .workbench { padding: 20px 16px 24px; }
    .nb-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .wb-head { align-items: stretch; }
  }
</style>
</head>
<body>

<div class="app workspace-app">
  <main class="main">
    <!-- 工作台：笔记本网格 -->
    <div class="workbench" id="workbenchView">
      <div class="wb-head">
        <div>
          <h1 class="wb-title">📓 FunNotes</h1>
          <p class="wb-sub" id="wbSub">选择一个笔记本开始</p>
        </div>
        <button class="ghost-btn primary" id="newNbBtn" data-tip="新建笔记本后直接进入笔记页">＋ 新建笔记本</button>
      </div>
      <ul class="nb-grid" id="nbGrid"></ul>
    </div>

    <!-- 设置视图（主区域整块替换，URL 不变） -->
    <div class="settings-view" id="settingsView" hidden></div>
  </main>

  <div class="footer-bar">
    <button class="footer-icon-btn" id="homeBtn" data-tip="笔记本列表" aria-label="笔记本列表">📓</button>
    <button class="footer-icon-btn" id="settingsBtn" data-tip="设置：AI 配置、标签管理" aria-label="设置">⚙️</button>
    <button class="ghost-btn" id="fileBtn" data-tip="文件：导入 / 导出 / 清空数据">📁 文件</button>

    <div class="footer-dropdown" id="fileDropdown" hidden>
      <button data-action="export">导出备份</button>
      <button data-action="import">导入文件（.json / .md）</button>
      <div class="dropdown-divider"></div>
      <button data-action="clear" class="danger">清空所有数据</button>
    </div>

    <input type="file" id="importFile"
           accept=".json,.md,.markdown,application/json,text/markdown,text/plain" hidden>
  </div>
</div>

<script type="module">
import {
  $, LS_CURRENT_NB, readStore, writeStore, takeNotice, formatTime, DEFAULT_NOTEBOOK_NAME,
} from './shared/utils.js';
import {
  state, loadAll, sortedNotebooks, notesInNotebook, createNotebook, saveNotebook,
  deleteNotebookCascade, exportBackup, importBackup, importMarkdown, resetAll,
} from './shared/db.js';
import * as ui from './shared/ui.js';
import { createSettingsView } from './shared/settings.js';

ui.initUi();

const els = {
  workbench: $('#workbenchView'),
  wbSub: $('#wbSub'),
  nbGrid: $('#nbGrid'),
  newNbBtn: $('#newNbBtn'),
  settingsView: $('#settingsView'),
  homeBtn: $('#homeBtn'),
  settingsBtn: $('#settingsBtn'),
  fileBtn: $('#fileBtn'),
  fileDropdown: $('#fileDropdown'),
  importFile: $('#importFile'),
};

let settingsView = null;
let currentView = 'grid';   // 'grid' | 'settings'

/* =========================================================
   启动
   ========================================================= */
async function boot() {
  await loadAll();

  settingsView = createSettingsView({
    root: els.settingsView,
    onClose: () => showGrid(),
  });

  bindEvents();
  renderGrid();
  showGrid();

  // 从笔记页跳回来时带的提示（例如无效 nb）
  const notice = takeNotice();
  if (notice) ui.toast(notice);
}

boot().catch((err) => {
  console.error(err);
  ui.toast('页面初始化失败：' + err.message);
});

/* =========================================================
   视图切换（URL 不变）
   ========================================================= */
function showGrid() {
  currentView = 'grid';
  els.workbench.hidden = false;
  els.settingsView.hidden = true;
  els.homeBtn.classList.add('active');
  els.settingsBtn.classList.remove('active');
}

function showSettings() {
  currentView = 'settings';
  els.workbench.hidden = true;
  els.settingsView.hidden = false;
  els.homeBtn.classList.remove('active');
  els.settingsBtn.classList.add('active');
  settingsView.render();
}

/* =========================================================
   笔记本网格
   ========================================================= */
function renderGrid() {
  const list = sortedNotebooks();

  els.wbSub.textContent = `共 ${list.length} 个笔记本 · 点击卡片进入笔记页`;

  els.nbGrid.innerHTML = '';
  const frag = document.createDocumentFragment();
  list.forEach((nb) => frag.appendChild(buildCard(nb)));

  const newCard = document.createElement('li');
  newCard.className = 'nb-card new';
  const newBtn = document.createElement('button');
  newBtn.className = 'nb-card-main';
  newBtn.innerHTML = '<span class="nb-plus">＋</span><span>新建笔记本</span>';
  newBtn.addEventListener('click', createNotebookFlow);
  newCard.appendChild(newBtn);
  frag.appendChild(newCard);

  els.nbGrid.appendChild(frag);
}

function buildCard(nb) {
  const active = notesInNotebook(nb.id);
  const trashed = state.notes.filter((n) => n.notebookId === nb.id && n.deletedAt).length;
  const latest = active.reduce((max, n) => Math.max(max, n.updatedAt || 0), 0);

  const li = document.createElement('li');
  li.className = 'nb-card';
  li.dataset.id = nb.id;

  const main = document.createElement('button');
  main.className = 'nb-card-main';
  main.title = '打开笔记本';

  const icon = document.createElement('span');
  icon.className = 'nb-icon';
  icon.textContent = '📓';

  const name = document.createElement('span');
  name.className = 'nb-name';
  name.textContent = nb.name;

  const meta = document.createElement('span');
  meta.className = 'nb-meta';
  meta.textContent = active.length
    ? `${active.length} 条笔记 · 最后编辑 ${formatTime(latest)}`
    : (trashed ? `还没有笔记 · 回收站 ${trashed} 条` : '还没有笔记');

  main.append(icon, name, meta);
  main.addEventListener('click', () => openNotebook(nb.id));

  const more = document.createElement('button');
  more.className = 'nb-more';
  more.textContent = '⋯';
  more.setAttribute('aria-label', '笔记本操作');
  more.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = more.getBoundingClientRect();
    openNotebookMenu(nb.id, r.left, r.bottom + 4);
  });

  li.append(main, more);
  li.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    openNotebookMenu(nb.id, e.clientX, e.clientY);
  });

  return li;
}

/* =========================================================
   笔记本操作
   ========================================================= */
function openNotebookMenu(id, x, y) {
  const nb = state.notebooks.find((n) => n.id === id);
  if (!nb) return;
  const active = notesInNotebook(id).length;
  const trashed = state.notes.filter((n) => n.notebookId === id && n.deletedAt).length;

  ui.openCtxMenu(x, y, [
    { heading: nb.name },
    { label: '打开', action: () => openNotebook(id) },
    { label: '重命名…', action: () => renameNotebook(id) },
    { separator: true },
    {
      label: `删除笔记本（${active + trashed} 条笔记）`,
      danger: true,
      action: () => deleteNotebook(id),
    },
  ]);
}

function openNotebook(id) {
  writeStore(LS_CURRENT_NB, id);
  location.href = './note.html?nb=' + encodeURIComponent(id);
}

async function createNotebookFlow() {
  const name = await ui.promptModal('新建笔记本', '新笔记本', {
    label: '笔记本名称',
    confirmText: '创建',
  });
  if (name === null) return;
  if (!name) { ui.toast('名称不能为空'); return; }

  const nb = await createNotebook(name);
  renderGrid();
  openNotebook(nb.id);          // 创建后直接进入笔记页
}

async function renameNotebook(id) {
  const nb = state.notebooks.find((n) => n.id === id);
  if (!nb) return;

  const name = await ui.promptModal('重命名笔记本', nb.name, {
    label: '笔记本名称',
    confirmText: '重命名',
  });
  if (name === null || !name || name === nb.name) return;

  const old = nb.name;
  nb.name = name;
  nb.updatedAt = Date.now();
  await saveNotebook(nb);
  renderGrid();
  ui.toast(`已从「${old}」重命名为「${name}」`);
}

async function deleteNotebook(id) {
  const nb = state.notebooks.find((n) => n.id === id);
  if (!nb) return;

  const active = notesInNotebook(id).length;
  const trashed = state.notes.filter((n) => n.notebookId === id && n.deletedAt).length;
  const total = active + trashed;

  const ok = await ui.confirmModal(
    '删除笔记本',
    `删除笔记本「${nb.name}」？\n该笔记本下共 ${total} 条笔记（其中回收站 ${trashed} 条）将被永久删除，此操作不可恢复。`,
    { confirmText: '删除', danger: true }
  );
  if (!ok) return;

  await deleteNotebookCascade(id);

  // 至少保留一个笔记本
  if (!state.notebooks.length) await createNotebook(DEFAULT_NOTEBOOK_NAME);

  if (readStore(LS_CURRENT_NB, '') === id) {
    writeStore(LS_CURRENT_NB, state.notebooks[0].id);
  }

  renderGrid();
  ui.toast(`已删除笔记本「${nb.name}」（${total} 条笔记）`);
}

/* =========================================================
   文件：导出 / 导入 / 清空
   ========================================================= */
function targetNotebookId() {
  const saved = readStore(LS_CURRENT_NB, '');
  const list = sortedNotebooks();
  if (list.some((nb) => nb.id === saved)) return saved;
  return list.length ? list[0].id : null;
}

async function clearAllData() {
  const first = await ui.confirmModal(
    '清空所有数据',
    '将删除所有笔记本、笔记（含回收站）和 AI 配置。此操作不可恢复，建议先导出备份。',
    { confirmText: '继续', danger: true }
  );
  if (!first) return;

  const second = await ui.confirmModal('再次确认', '真的要清空全部数据吗？',
    { confirmText: '清空', danger: true });
  if (!second) return;

  try {
    const nb = await resetAll();
    writeStore(LS_CURRENT_NB, nb.id);
    settingsView.render();
    renderGrid();
    ui.hideToast();
    ui.toast('已清空所有数据');
  } catch (err) {
    console.error('清空失败', err);
    ui.toast('清空失败：' + err.message);
  }
}

/* =========================================================
   事件绑定
   ========================================================= */
function bindEvents() {
  els.newNbBtn.addEventListener('click', createNotebookFlow);

  els.homeBtn.addEventListener('click', showGrid);
  els.settingsBtn.addEventListener('click', () => {
    if (currentView === 'settings') showGrid();
    else showSettings();
  });

  ui.setupDropdown(els.fileBtn, els.fileDropdown, {
    items: async (action) => {
      if (action === 'export') {
        const info = exportBackup();
        ui.toast(`已导出 ${info.notebooks} 个笔记本、${info.active} 条笔记（含回收站 ${info.trash} 条）`);
      } else if (action === 'import') {
        els.importFile.click();
      } else if (action === 'clear') {
        await clearAllData();
      }
    },
  });

  els.importFile.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const name = (file.name || '').toLowerCase();

    try {
      if (name.endsWith('.md') || name.endsWith('.markdown')) {
        const nbId = targetNotebookId();
        if (!nbId) throw new Error('请先创建一个笔记本');
        const text = await file.text();
        const info = await importMarkdown(text, file.name, nbId);
        renderGrid();
        const nb = state.notebooks.find((n) => n.id === nbId);
        ui.toast(`已向「${nb ? nb.name : '笔记本'}」导入 ${info.count} 条笔记，父笔记「${info.rootTitle}」`);
      } else {
        const info = await importBackup(file);
        renderGrid();
        ui.toast(`导入完成：新增 ${info.added} 条笔记` + (info.skipped ? `，跳过 ${info.skipped} 条重复` : ''));
      }
    } catch (err) {
      console.error('导入失败', err);
      ui.toast('导入失败：' + err.message);
    }

    e.target.value = '';
  });
}
</script>

</body>
</html>
