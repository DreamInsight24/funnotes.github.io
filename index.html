<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FunNotes · 工作台</title>
<link rel="stylesheet" href="./shared/style.css">
<style>
  /* 工作台专属：笔记本网格 + 拖拽排序 */
  .workspace-app { flex-direction: column; }

  .workbench {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 32px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .wb-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .wb-title { margin: 0; font-size: 24px; font-weight: 600; }
  .wb-sub { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

  .nb-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  .nb-card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s, transform .15s, opacity .15s;
  }
  .nb-card:hover {
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
    transform: translateY(-1px);
  }
  .nb-card[draggable="true"] { cursor: grab; }
  .nb-card.dragging { opacity: .45; }

  /* 拖拽指示：左右插入 / 合并到卡片里 */
  .nb-card.drop-before::before,
  .nb-card.drop-after::after {
    content: '';
    position: absolute;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
  }
  .nb-card.drop-before::before { left: -9px; }
  .nb-card.drop-after::after { right: -9px; }
  .nb-card.drop-inside {
    box-shadow: inset 0 0 0 2px var(--accent);
    background: var(--accent-soft);
  }

  .nb-card-main {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    width: 100%;
    min-height: 118px;
    padding: 18px 16px;
    background: none;
    border: none;
    border-radius: 12px;
    text-align: left;
  }

  .nb-icon { font-size: 26px; line-height: 1; }
  .nb-name {
    font-size: 15px;
    font-weight: 600;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nb-meta { font-size: 12px; color: var(--muted); }

  .nb-more {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    border: 1px solid transparent;
    background: none;
    color: var(--muted);
    opacity: 0;
    transition: opacity .15s, background .15s, color .15s, border-color .15s;
  }
  .nb-card:hover .nb-more { opacity: 1; }
  .nb-more:hover { background: var(--bg); color: var(--text); border-color: var(--border); }

  .nb-card.new { border-style: dashed; }
  .nb-card.new .nb-card-main {
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
  }
  .nb-card.new:hover .nb-card-main { color: var(--accent); }
  .nb-card.new .nb-plus { font-size: 22px; }

  .wb-tip { font-size: 12px; color: var(--muted); }

  @media (max-width: 720px) {
    .workbench { padding: 20px 16px 24px; }
    .nb-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>

<div class="app workspace-app">
  <main class="main">
    <!-- 工作台：笔记本网格 -->
    <div class="workbench" id="workbenchView">
      <div class="wb-head">
        <div>
          <h1 class="wb-title">📓 FunNotes</h1>
          <p class="wb-sub" id="wbSub">选择一个笔记本开始</p>
        </div>
      </div>
      <ul class="nb-grid" id="nbGrid"></ul>
      <p class="wb-tip">拖动卡片可以调整顺序；拖到另一个笔记本上可以把它的笔记页合并过去。</p>
    </div>

    <!-- 回收站视图（组件渲染，按笔记本范围） -->
    <div class="trash-view" id="trashView" hidden></div>
    <!-- 设置视图（主区域整块替换，URL 不变） -->
    <div class="settings-view" id="settingsView" hidden></div>
  </main>

  <div class="footer-bar">
    <button class="ghost-btn" id="homeBtn" data-tip="回到笔记本列表">📓 笔记本</button>
    <button class="ghost-btn" id="importBtn" data-tip="导入用户数据 / 笔记本 / .md">📤 导入</button>
    <button class="ghost-btn" id="exportBtn" data-tip="导出全部用户数据（笔记本 + 配置）">📥 导出</button>
    <button class="ghost-btn" id="settingsBtn" data-tip="设置：AI 配置、数据管理">⚙️ 设置</button>
    <button class="ghost-btn" id="trashBtn" data-tip="回收站（上次打开的笔记本）">🗑️ 回收站</button>

    <input type="file" id="importFile"
           accept=".json,.md,.markdown,application/json,text/markdown,text/plain" hidden>
  </div>
</div>

<script type="module">
import {
  $, LS_CURRENT_NB, readStore, writeStore, takeNotice, formatTime, DEFAULT_NOTEBOOK_NAME,
} from './shared/utils.js';
import {
  state, loadAll, getNotebook, sortedNotebooks, notesInNotebook, createNotebook, saveNotebook,
  deleteNotebookCascade, reorderNotebooks, mergeNotebooks,
  exportUserData, readPayload, mergeUserData, addNotebookFromPayload, createNotebookFromMarkdown,
  deleteAllUserData,
} from './shared/db.js';
import * as ui from './shared/ui.js';
import { createSettingsView, askConfigMerge, onTagsChanged } from './shared/settings.js';
import { createTrashView } from './shared/trash.js';

ui.initUi();

const els = {
  workbench: $('#workbenchView'),
  wbSub: $('#wbSub'),
  nbGrid: $('#nbGrid'),
  settingsView: $('#settingsView'),
  trashView: $('#trashView'),
  homeBtn: $('#homeBtn'),
  importBtn: $('#importBtn'),
  exportBtn: $('#exportBtn'),
  settingsBtn: $('#settingsBtn'),
  trashBtn: $('#trashBtn'),
  importFile: $('#importFile'),
};

let settingsView = null;
let trashView = null;
let currentView = 'grid';    // 'grid' | 'settings' | 'trash'
let dragState = null;
let dropTarget = null;
let currentTrashId = null;

/* =========================================================
   启动
   ========================================================= */
async function boot() {
  await loadAll();

  settingsView = createSettingsView({
    root: els.settingsView,
    onClose: () => showGrid(),
    // 主界面没有「当前笔记本」，因此设置里不显示标签
    getScopeNotebookId: () => null,
    onWipe: async () => {
      await deleteAllUserData();
      renderGrid();
      settingsView.render();
      ui.hideToast();
      ui.toast('已删除所有用户数据');
    },
  });

  trashView = createTrashView({
    root: els.trashView,
    closeLabel: '返回工作台',
    getNotebookName: (id) => (getNotebook(id) || {}).name || '',
    onChange: () => { renderTrash(); renderGrid(); },
    onClose: () => showGrid(),
  });

  onTagsChanged(() => renderGrid());

  bindEvents();
  renderGrid();
  showGrid();

  // 从笔记页跳回来时带的提示（例如无效 nb）
  const notice = takeNotice();
  if (notice) ui.toast(notice);
}

boot().catch((err) => {
  console.error(err);
  ui.toast('页面初始化失败：' + err.message);
});

/* =========================================================
   视图切换（URL 不变）
   ========================================================= */
function setActive(...active) {
  els.homeBtn.classList.toggle('active', active.includes('home'));
  els.settingsBtn.classList.toggle('active', active.includes('settings'));
  els.trashBtn.classList.toggle('active', active.includes('trash'));
}

function showGrid() {
  currentView = 'grid';
  els.workbench.hidden = false;
  els.settingsView.hidden = true;
  els.trashView.hidden = true;
  setActive('home');
}

function showSettings() {
  currentView = 'settings';
  els.workbench.hidden = true;
  els.settingsView.hidden = false;
  els.trashView.hidden = true;
  setActive('settings');
  settingsView.render();
}

function showTrash(nbId) {
  const id = nbId || targetNotebookId();
  if (!id) { ui.toast('还没有可查看的笔记本'); return; }
  currentView = 'trash';
  els.workbench.hidden = true;
  els.settingsView.hidden = true;
  els.trashView.hidden = false;
  setActive('trash');
  renderTrash(id);
}

function renderTrash(nbId) {
  trashView.render(nbId || currentTrashId || targetNotebookId());
  currentTrashId = nbId || currentTrashId;
}

/* =========================================================
   笔记本网格
   ========================================================= */
function renderGrid() {
  const list = sortedNotebooks();
  els.wbSub.textContent = `共 ${list.length} 个笔记本 · 点击卡片进入笔记页`;

  els.nbGrid.innerHTML = '';
  const frag = document.createDocumentFragment();
  list.forEach((nb) => frag.appendChild(buildCard(nb)));

  const newCard = document.createElement('li');
  newCard.className = 'nb-card new';
  const newBtn = document.createElement('button');
  newBtn.className = 'nb-card-main';
  newBtn.innerHTML = '<span class="nb-plus">＋</span><span>新建笔记本</span>';
  newBtn.addEventListener('click', createNotebookFlow);
  newCard.appendChild(newBtn);
  frag.appendChild(newCard);

  els.nbGrid.appendChild(frag);
}

function buildCard(nb) {
  const active = notesInNotebook(nb.id);
  const trashed = state.notes.filter((n) => n.notebookId === nb.id && n.deletedAt).length;
  const latest = active.reduce((max, n) => Math.max(max, n.updatedAt || 0), 0);

  const li = document.createElement('li');
  li.className = 'nb-card';
  li.dataset.id = nb.id;
  li.draggable = true;

  const main = document.createElement('button');
  main.className = 'nb-card-main';
  main.title = '打开笔记本';

  const icon = document.createElement('span');
  icon.className = 'nb-icon';
  icon.textContent = '📓';

  const name = document.createElement('span');
  name.className = 'nb-name';
  name.textContent = nb.name;

  const meta = document.createElement('span');
  meta.className = 'nb-meta';
  meta.textContent = active.length
    ? `${active.length} 条笔记 · 最后编辑 ${formatTime(latest)}`
    : (trashed ? `还没有笔记 · 回收站 ${trashed} 条` : '还没有笔记');

  main.append(icon, name, meta);
  main.addEventListener('click', () => openNotebook(nb.id));

  const more = document.createElement('button');
  more.className = 'nb-more';
  more.textContent = '⋯';
  more.setAttribute('aria-label', '笔记本操作');
  more.addEventListener('click', (e) => {
    e.stopPropagation();
    const r = more.getBoundingClientRect();
    openNotebookMenu(nb.id, r.left, r.bottom + 4);
  });

  li.append(main, more);
  li.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    openNotebookMenu(nb.id, e.clientX, e.clientY);
  });

  bindCardDrag(li, nb);
  return li;
}

/* =========================================================
   拖拽：排序 / 合并到其它笔记本
   ========================================================= */
function clearDropMarks() {
  els.nbGrid.querySelectorAll('.drop-before, .drop-after, .drop-inside')
    .forEach((el) => el.classList.remove('drop-before', 'drop-after', 'drop-inside'));
}

function bindCardDrag(li, nb) {
  li.addEventListener('dragstart', (e) => {
    dragState = { id: nb.id };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', nb.id); } catch (_) {}
    li.classList.add('dragging');
  });

  li.addEventListener('dragend', () => {
    dragState = null;
    dropTarget = null;
    li.classList.remove('dragging');
    clearDropMarks();
  });

  li.addEventListener('dragover', (e) => {
    if (!dragState || dragState.id === nb.id) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';

    const rect = li.getBoundingClientRect();
    const x = e.clientX - rect.left;
    let position = 'inside';
    if (x < rect.width * 0.3) position = 'before';
    else if (x > rect.width * 0.7) position = 'after';

    clearDropMarks();
    li.classList.add('drop-' + position);
    dropTarget = { id: nb.id, position };
  });

  li.addEventListener('dragleave', (e) => {
    if (!li.contains(e.relatedTarget)) {
      li.classList.remove('drop-before', 'drop-after', 'drop-inside');
    }
  });

  li.addEventListener('drop', async (e) => {
    e.preventDefault();
    if (!dragState || !dropTarget) return;
    const sourceId = dragState.id;
    const { id: targetId, position } = dropTarget;
    dragState = null;
    dropTarget = null;
    clearDropMarks();

    if (sourceId === targetId) return;
    if (position === 'inside') await askMergeNotebooks(sourceId, targetId);
    else await reorderNotebook(sourceId, targetId, position);
  });
}

async function reorderNotebook(sourceId, targetId, position) {
  const ids = sortedNotebooks().map((n) => n.id).filter((id) => id !== sourceId);
  const idx = ids.indexOf(targetId);
  if (idx < 0) return;

  ids.splice(position === 'before' ? idx : idx + 1, 0, sourceId);
  await reorderNotebooks(ids);
  renderGrid();
}

async function askMergeNotebooks(sourceId, targetId) {
  const source = getNotebook(sourceId);
  const target = getNotebook(targetId);
  if (!source || !target) return;

  const count = state.notes.filter((n) => n.notebookId === sourceId).length;
  const ok = await ui.confirmModal(
    '合并到另一个笔记本',
    `把「${source.name}」的 ${count} 条笔记页放进「${target.name}」？\n` +
    `合并后「${source.name}」会被删除（笔记页本身不会丢失）。`,
    { confirmText: '合并' }
  );
  if (!ok) return;

  const moved = await mergeNotebooks(sourceId, targetId);
  renderGrid();
  ui.toast(`已把 ${moved} 条笔记页合并到「${target.name}」`);
}

/* =========================================================
   笔记本操作
   ========================================================= */
function openNotebookMenu(id, x, y) {
  const nb = state.notebooks.find((n) => n.id === id);
  if (!nb) return;
  const active = notesInNotebook(id).length;
  const trashed = state.notes.filter((n) => n.notebookId === id && n.deletedAt).length;

  ui.openCtxMenu(x, y, [
    { heading: nb.name },
    { label: '打开', action: () => openNotebook(id) },
    { label: '重命名…', action: () => renameNotebook(id) },
    {
      label: trashed ? `回收站（${trashed} 条）` : '回收站',
      action: () => showTrash(id),
    },
    { separator: true },
    {
      label: `删除笔记本（${active + trashed} 条笔记）`,
      danger: true,
      action: () => deleteNotebook(id),
    },
  ]);
}

function openNotebook(id) {
  writeStore(LS_CURRENT_NB, id);
  location.href = './note.html?nb=' + encodeURIComponent(id);
}

async function createNotebookFlow() {
  const name = await ui.promptModal('新建笔记本', '新笔记本', {
    label: '笔记本名称',
    confirmText: '创建',
  });
  if (name === null) return;
  if (!name) { ui.toast('名称不能为空'); return; }

  const nb = await createNotebook(name);
  renderGrid();
  openNotebook(nb.id);          // 创建后直接进入笔记页
}

async function renameNotebook(id) {
  const nb = state.notebooks.find((n) => n.id === id);
  if (!nb) return;

  const name = await ui.promptModal('重命名笔记本', nb.name, {
    label: '笔记本名称',
    confirmText: '重命名',
  });
  if (name === null || !name || name === nb.name) return;

  const old = nb.name;
  nb.name = name;
  nb.updatedAt = Date.now();
  await saveNotebook(nb);
  renderGrid();
  ui.toast(`已从「${old}」重命名为「${name}」`);
}

async function deleteNotebook(id) {
  const nb = state.notebooks.find((n) => n.id === id);
  if (!nb) return;

  const active = notesInNotebook(id).length;
  const trashed = state.notes.filter((n) => n.notebookId === id && n.deletedAt).length;
  const total = active + trashed;

  const ok = await ui.confirmModal(
    '删除笔记本',
    `删除笔记本「${nb.name}」？\n该笔记本下共 ${total} 条笔记（其中回收站 ${trashed} 条）将被永久删除，此操作不可恢复。`,
    { confirmText: '删除', danger: true }
  );
  if (!ok) return;

  await deleteNotebookCascade(id);

  // 至少保留一个笔记本
  if (!state.notebooks.length) await createNotebook(DEFAULT_NOTEBOOK_NAME);

  if (readStore(LS_CURRENT_NB, '') === id) {
    writeStore(LS_CURRENT_NB, state.notebooks[0].id);
  }

  renderGrid();
  ui.toast(`已删除笔记本「${nb.name}」（${total} 条笔记）`);
}

/* =========================================================
   导入 / 导出（用户数据）
   ========================================================= */
function targetNotebookId() {
  const saved = readStore(LS_CURRENT_NB, '');
  const list = sortedNotebooks();
  if (list.some((nb) => nb.id === saved)) return saved;
  return list.length ? list[0].id : null;
}

async function handleImport(file) {
  const lower = (file.name || '').toLowerCase();

  // .md → 作为全新笔记本导入，笔记本名称 = 文件名
  if (lower.endsWith('.md') || lower.endsWith('.markdown')) {
    const text = await file.text();
    const info = await createNotebookFromMarkdown(text, file.name);
    renderGrid();
    ui.toast(`已新建笔记本「${info.notebook.name}」（${info.count} 条笔记）`);
    return;
  }

  const data = JSON.parse(await file.text());
  const payload = readPayload(data);
  if (payload.kind === 'unknown') throw new Error('文件里没有可导入的内容');

  // 笔记本文件 → 直接作为新笔记本
  if (payload.kind === 'notebook') {
    const info = await addNotebookFromPayload(payload.notebook, payload.notes);
    renderGrid();
    ui.toast(`已作为新笔记本导入「${info.notebook.name}」（${info.notes} 条笔记）`);
    return;
  }

  // 用户数据 → 取并集全部添加
  const info = await mergeUserData({ notebooks: payload.notebooks, notes: payload.notes });

  // 配置字段：导入后询问保留原有还是覆盖
  if (payload.settings && payload.settings.ai) {
    await askConfigMerge(payload.settings.ai);
    settingsView.render();
  }

  renderGrid();
  ui.toast(
    `导入完成：新增 ${info.notebooks} 个笔记本、${info.notes} 条笔记` +
    (info.skipped ? `，跳过 ${info.skipped} 条重复` : '')
  );
}

/* =========================================================
   事件绑定
   ========================================================= */
function bindEvents() {
  els.homeBtn.addEventListener('click', showGrid);

  els.settingsBtn.addEventListener('click', () => {
    if (currentView === 'settings') showGrid();
    else showSettings();
  });

  els.trashBtn.addEventListener('click', () => {
    if (currentView === 'trash') showGrid();
    else showTrash();
  });

  els.importBtn.addEventListener('click', () => els.importFile.click());
  els.exportBtn.addEventListener('click', () => {
    const info = exportUserData();
    ui.toast(`已导出 ${info.notebooks} 个笔记本、${info.active} 条笔记（含回收站 ${info.trash} 条）与配置`);
  });

  els.importFile.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      await handleImport(file);
    } catch (err) {
      console.error('导入失败', err);
      ui.toast('导入失败：' + err.message);
    }
    e.target.value = '';
  });
}
</script>

</body>
</html>
